name: Reusable AI Agent Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

      agent_name:
        description: "AI Agent name"
        required: true
        type: string

      terraform_plan:
        description: "Run Terraform plan"
        required: false
        default: true
        type: boolean

      deploy_powerplatform:
        description: "Deploy Power Platform solution"
        required: false
        default: true
        type: boolean

jobs:
  validate:
    name: Validate deployment inputs
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      agent_name: ${{ steps.agent-config.outputs.agent_name }}
      agent_display_name: ${{ steps.agent-config.outputs.agent_display_name }}
      agent_environment: ${{ steps.agent-config.outputs.environment }}
      resource_group: ${{ steps.agent-config.outputs.resource_group }}
      solution: ${{ steps.agent-config.outputs.solution }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate agent configuration
        run: |
          python src/scripts/validate-agent-config.py \
            "src/agent/${{ inputs.agent_name }}/agent.yaml" \
            "${{ inputs.environment }}"

      - name: Load agent configuration
        id: agent-config
        run: |
          python - <<'PY'
          import os
          import yaml

          path = "src/agent/${{ inputs.agent_name }}/agent.yaml"

          with open(path, "r", encoding="utf-8") as file:
              config = yaml.safe_load(file)

          agent = config["agent"]
          azure = config["azure"]
          powerplatform = config["powerplatform"]

          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a", encoding="utf-8") as file:
              file.write(f"agent_name={agent['name']}\n")
              file.write(f"agent_display_name={agent['display_name']}\n")
              file.write(f"environment={agent['environment']}\n")
              file.write(f"resource_group={azure['resource_group']}\n")
              file.write(f"solution={powerplatform['solution']}\n")

          print(f"Loaded configuration for {agent['display_name']}")
          print(f"Environment: {agent['environment']}")
          print(f"Resource Group: {azure['resource_group']}")
          print(f"Solution: {powerplatform['solution']}")
          PY

      - name: Display deployment configuration
        run: |
          echo "========================================"
          echo "AI Agent Deployment"
          echo "========================================"
          echo "Agent:        ${{ inputs.agent_name }}"
          echo "Environment:  ${{ inputs.environment }}"
          echo "========================================"

  azure-auth:
    name: Authenticate to Azure
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: |
          echo "Azure authentication successful."
          az account show \
            --query "{subscription:id,tenantId:tenantId,name:name}" \
            -o table

  terraform:
    name: Terraform Plan
    if: ${{ inputs.terraform_plan }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan

  powerplatform:
    name: Deploy Power Platform Solution
    if: ${{ inputs.deploy_powerplatform }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import Power Platform solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          app-id: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ vars.POWER_PLATFORM_TENANT_ID }}
          solution-file: "powerplatform/exports/AIAgentPlatformCore.zip"
          publish-changes: true

  deployment-summary:
    name: Deployment Summary
    if: ${{ always() }}
    needs:
      - validate
      - terraform
      - powerplatform
    runs-on: ubuntu-latest

    steps:
      - name: Deployment summary
        run: |
          echo "========================================"
          echo "AI AGENT DEPLOYMENT SUMMARY"
          echo "========================================"
          echo "Agent:        ${{ inputs.agent_name }}"
          echo "Environment:  ${{ inputs.environment }}"
          echo "========================================"
          echo "Terraform:    ${{ needs.terraform.result }}"
          echo "Power Platform: ${{ needs.powerplatform.result }}"
          echo "========================================"
