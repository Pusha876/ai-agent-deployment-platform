name: Reusable AI Agent Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

      agent_name:
        description: "AI Agent name"
        required: true
        type: string

jobs:
  validate:
    name: Validate deployment inputs
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display deployment configuration
        run: |
          echo "========================================"
          echo "AI Agent Deployment"
          echo "========================================"
          echo "Agent:        ${{ inputs.agent_name }}"
          echo "Environment:  ${{ inputs.environment }}"
          echo "========================================"

  azure-auth:
    name: Authenticate to Azure
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: |
          echo "Azure authentication successful."
          az account show \
            --query "{subscription:id,tenantId:tenantId,name:name}" \
            -o table

  terraform:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan

  powerplatform:
    name: Deploy Power Platform Solution
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import Power Platform solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          app-id: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ vars.POWER_PLATFORM_TENANT_ID }}
          solution-file: "powerplatform/exports/AIAgentPlatformCore.zip"
          publish-changes: true
