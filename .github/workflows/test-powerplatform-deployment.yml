name: Power Platform Deployment Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-powerplatform:
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Verify Power Platform authentication
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          app-id: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ vars.POWER_PLATFORM_TENANT_ID }}

      - name: Import AIAgentPlatformCore
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          app-id: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ vars.POWER_PLATFORM_TENANT_ID }}
          solution-file: ./powerplatform/exports/AIAgentPlatformCore.zip
          publish-changes: true
