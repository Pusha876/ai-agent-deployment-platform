name: Deploy All Agents - TEST

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    name: Discover agents
    runs-on: ubuntu-latest

    outputs:
      agents: ${{ steps.agents.outputs.agents }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover agent configurations
        id: agents
        shell: bash
        run: |
          set -euo pipefail

          agents=""

          for config in src/agent/*/agent.yaml; do
            if [[ -f "$config" ]]; then
              agent_name="$(basename "$(dirname "$config")")"

              if [[ -n "$agents" ]]; then
                agents="${agents},"
              fi

              agents="${agents}\"${agent_name}\""
            fi
          done

          if [[ -z "$agents" ]]; then
            echo "ERROR: No agent configurations found."
            exit 1
          fi

          matrix="[${agents}]"

          echo "Discovered agents:"
          echo "$matrix"

          echo "agents=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.agent }}
    needs: discover

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}

    uses: ./.github/workflows/deploy-agent-reusable.yml

    with:
      environment: test
      agent_name: ${{ matrix.agent }}
      terraform_plan: true
      deploy_powerplatform: true
