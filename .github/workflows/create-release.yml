name: Create Platform Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read platform version
        id: version
        shell: bash
        run: |
          VERSION="$(cat VERSION)"

          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="${{ steps.version.outputs.version }}"

          echo "Git tag version: $TAG_VERSION"
          echo "VERSION file:    $FILE_VERSION"

          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "ERROR: Git tag does not match VERSION."
            exit 1
          fi

      - name: Verify Power Platform solution
        shell: bash
        run: |
          SOLUTION="powerplatform/exports/AIAgentPlatformCore.zip"

          if [[ ! -f "$SOLUTION" ]]; then
            echo "ERROR: Power Platform solution not found:"
            echo "$SOLUTION"
            exit 1
          fi

          echo "Power Platform solution found."

      - name: Create release artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_NAME="ai-agent-deployment-platform-v${VERSION}"

          mkdir -p "release/${ARTIFACT_NAME}"

          cp VERSION "release/${ARTIFACT_NAME}/"
          cp README.md "release/${ARTIFACT_NAME}/"

          cp -R .github "release/${ARTIFACT_NAME}/"
          cp -R docs "release/${ARTIFACT_NAME}/"
          cp -R infrastructure "release/${ARTIFACT_NAME}/"
          cp -R powerplatform "release/${ARTIFACT_NAME}/"
          cp -R scripts "release/${ARTIFACT_NAME}/"
          cp -R src "release/${ARTIFACT_NAME}/"

          if [[ -d "tests" ]]; then
            cp -R tests "release/${ARTIFACT_NAME}/"
          fi

          cd release

          zip -r \
            "${ARTIFACT_NAME}.zip" \
            "${ARTIFACT_NAME}"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd release

          sha256sum \
            "ai-agent-deployment-platform-v${{ steps.version.outputs.version }}.zip" \
            > "ai-agent-deployment-platform-v${{ steps.version.outputs.version }}.sha256"

      - name: Display release artifacts
        shell: bash
        run: |
          ls -lh release/

          echo ""
          echo "SHA-256:"
          cat "release/ai-agent-deployment-platform-v${{ steps.version.outputs.version }}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Agent Deployment Platform v${{ steps.version.outputs.version }}"
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/ai-agent-deployment-platform-v${{ steps.version.outputs.version }}.zip
            release/ai-agent-deployment-platform-v${{ steps.version.outputs.version }}.sha256
