name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to promote (example: v1.0.0)"
        required: true
        type: string

      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Display promotion request
        run: |
          echo "========================================"
          echo "RELEASE PROMOTION"
          echo "========================================"
          echo "Version:     ${{ inputs.version }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "========================================"

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must use semantic version format."
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "Version format is valid."

  download-release:
    name: Download Release Artifact
    needs: validate-release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      commit: ${{ steps.release-metadata.outputs.commit }}
      artifact: ${{ steps.release-metadata.outputs.artifact }}
      sha256: ${{ steps.release-metadata.outputs.sha256 }}

    steps:
      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release

          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --pattern "*.sha256" \
            --pattern "manifest.json" \
            --dir release

      - name: Display release contents
        run: |
          echo "Release artifacts:"
          ls -lh release

      - name: Verify SHA256 checksum
        working-directory: release
        run: |
          sha256sum -c *.sha256

          echo "SHA256 verification PASSED."

      - name: Verify release manifest
        id: release-metadata
        working-directory: release
        run: |
          python - <<'PY'
          import json
          import os
          import hashlib
          import sys

          with open("manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          version = manifest["version"]
          commit = manifest["commit"]
          artifact = manifest["artifact"]
          manifest_sha = manifest["sha256"]

          requested_version = "${{ inputs.version }}"

          print(f"Manifest version:   {version}")
          print(f"Requested version:  {requested_version}")
          print(f"Commit:             {commit}")
          print(f"Artifact:           {artifact}")
          print(f"Manifest SHA-256:   {manifest_sha}")

          if version != requested_version:
              print("ERROR: Manifest version does not match requested release.")
              sys.exit(1)

          if not os.path.isfile(artifact):
              print(f"ERROR: Artifact not found: {artifact}")
              sys.exit(1)

          with open(artifact, "rb") as f:
              actual_sha = hashlib.sha256(f.read()).hexdigest()

          if actual_sha != manifest_sha:
              print("ERROR: Artifact SHA-256 does not match manifest.")
              print(f"Expected: {manifest_sha}")
              print(f"Actual:   {actual_sha}")
              sys.exit(1)

          print("Release manifest verification PASSED.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"commit={commit}\n")
              output.write(f"artifact={artifact}\n")
              output.write(f"sha256={manifest_sha}\n")
          PY

  deploy-release:
    name: Deploy Verified Release
    needs:
      - validate-release
      - download-release

    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release

          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --pattern "*.sha256" \
            --dir release

      - name: Verify release artifact
        working-directory: release
        run: |
          sha256sum -c *.sha256

          echo "Release artifact verified."
          ls -lh

      - name: Extract release artifact
        run: |
          mkdir -p artifact

          unzip -q release/*.zip -d artifact

          echo "Release artifact extracted:"
          find artifact -maxdepth 3 -type f | sort

      - name: Verify Power Platform solution exists
        id: solution
        run: |
          # The release archive nests content under ai-agent-deployment-platform-vX.Y.Z/
          SOLUTION="$(find artifact -maxdepth 4 -type f -path '*/powerplatform/exports/AIAgentPlatformCore.zip' | head -n 1)"

          if [[ -z "$SOLUTION" ]]; then
            echo "ERROR: Power Platform solution not found under artifact/*/powerplatform/exports/"
            exit 1
          fi

          echo "Power Platform solution found:"
          ls -lh "$SOLUTION"

          echo "path=$SOLUTION" >> "$GITHUB_OUTPUT"

      - name: Display deployment target
        run: |
          echo "========================================"
          echo "DEPLOYING VERIFIED RELEASE"
          echo "========================================"
          echo "Release:      ${{ needs.download-release.outputs.version }}"
          echo "Environment:  ${{ inputs.environment }}"
          echo "Commit:       ${{ needs.download-release.outputs.commit }}"
          echo "Artifact:     ${{ needs.download-release.outputs.artifact }}"
          echo "SHA-256:      ${{ needs.download-release.outputs.sha256 }}"
          echo "Run ID:       ${{ github.run_id }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "========================================"

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Deploy verified Power Platform solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          app-id: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ vars.POWER_PLATFORM_TENANT_ID }}
          solution-file: ${{ steps.solution.outputs.path }}
          publish-changes: true

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "RELEASE DEPLOYMENT SUMMARY"
          echo "========================================"
          echo "Release:       ${{ needs.download-release.outputs.version }}"
          echo "Environment:   ${{ inputs.environment }}"
          echo "Commit:        ${{ needs.download-release.outputs.commit }}"
          echo "Artifact:      ${{ needs.download-release.outputs.artifact }}"
          echo "SHA-256:       ${{ needs.download-release.outputs.sha256 }}"
          echo "Run ID:        ${{ github.run_id }}"
          echo "Triggered by:  ${{ github.actor }}"
          echo "========================================"
          echo "Artifact:      VERIFIED"
          echo "Deployment:    SUCCESS"
          echo "========================================"

  promotion-summary:
    name: Promotion Summary
    if: ${{ always() }}
    needs:
      - validate-release
      - download-release
      - deploy-release
    runs-on: ubuntu-latest

    steps:
      - name: Display promotion result
        run: |
          echo "========================================"
          echo "RELEASE PROMOTION SUMMARY"
          echo "========================================"
          echo "Release:       ${{ needs.download-release.outputs.version }}"
          echo "Environment:   ${{ inputs.environment }}"
          echo "Commit:        ${{ needs.download-release.outputs.commit }}"
          echo "Artifact:      ${{ needs.download-release.outputs.artifact }}"
          echo "SHA-256:       ${{ needs.download-release.outputs.sha256 }}"
          echo "Run ID:        ${{ github.run_id }}"
          echo "Triggered by:  ${{ github.actor }}"
          echo "========================================"
          echo "Validation:    ${{ needs.validate-release.result }}"
          echo "Artifact:      ${{ needs.download-release.result }}"
          echo "Deployment:    ${{ needs.deploy-release.result }}"
          echo "========================================"

          if [[ "${{ needs.validate-release.result }}" == "success" ]] && \
             [[ "${{ needs.download-release.result }}" == "success" ]] && \
             [[ "${{ needs.deploy-release.result }}" == "success" ]]; then
            echo "Overall Status: SUCCESS"
          else
            echo "Overall Status: FAILED"
            exit 1
          fi
